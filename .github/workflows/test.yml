name: SHADE self-check

on:
  push:
  pull_request:
  workflow_dispatch:  # lets anyone manually trigger the extended-benchmark job below from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (pinned)
        run: pip install -r requirements.txt
      - name: Run formal verification + evaluation harness (decision matrix, DLP benchmark, explainability)
        run: python3 tests/test_pipeline.py
      - name: Run DLP evaluation harness standalone and upload report
        run: python3 shade/eval_harness.py --n 300 --seed 42 --out experiments/output/dlp_benchmark_report.json
      - name: Upload DLP benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: dlp-benchmark-report
          path: experiments/output/dlp_benchmark_report.json
      - name: Run full pipeline end-to-end
        run: python3 shade/run_pipeline.py --n 500
      - name: Run full pipeline with the opt-in policy-review stage (see ADR 0002)
        run: python3 shade/run_pipeline.py --n 200 --propose_policy_review
      - name: Run full pipeline with the opt-in MCP monitoring stage (see ADR 0003)
        run: python3 shade/run_pipeline.py --n 200 --include_mcp_monitoring
      - name: Run full pipeline with the opt-in DP aggregate reporting stage (see ADR 0004)
        run: python3 shade/run_pipeline.py --n 200 --privatize_governance_report
      - name: Smoke-test experiments/ scaffolding (not part of the core pipeline; see docs/extensions.md -- this only checks it runs without error, not correctness; extensions/ is empty as of ADR 0004, all three original modules have graduated into shade/)
        run: python3 experiments/benchmark_dataset_generator.py --n 200

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t shade .
      - name: Run self-check inside container
        run: docker run --rm shade python3 tests/test_pipeline.py

  extended-benchmark:
    # Opt-in, manual trigger only (Actions tab -> Run workflow) -- this is
    # intentionally NOT run on every push/PR, since it's slower than the
    # `test` job above and answers a different question (does correctness
    # hold at higher volume and across more seeds, not just the fast n=300
    # CI uses). See scripts/run_extended_benchmark.py's docstring and
    # docs/benchmark.md's "Scale check" section for why this is separate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (pinned)
        run: pip install -r requirements.txt
      - name: Run extended benchmark (DLP at scale + multi-seed, extensions under load at n=5000)
        run: python3 scripts/run_extended_benchmark.py --out experiments/output/extended_benchmark_report.json
      - name: Upload extended benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: extended-benchmark-report
          path: experiments/output/extended_benchmark_report.json
