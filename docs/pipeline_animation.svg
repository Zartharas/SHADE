<svg viewBox="0 0 940 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram of the SHADE pipeline: Generate, Discover, Classify, Govern, Validate, looping to show data flow through each stage">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8fa6bb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="220" fill="none"/>
  <text x="470" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1b2733" font-weight="600">SHADE pipeline (synthetic data only) -- each stage highlights as the run reaches it</text>
  <line x1="172" y1="107.0" x2="200" y2="107.0" stroke="#8fa6bb" stroke-width="2" marker-end="url(#arrow)"/><line x1="360" y1="107.0" x2="388" y2="107.0" stroke="#8fa6bb" stroke-width="2" marker-end="url(#arrow)"/><line x1="548" y1="107.0" x2="576" y2="107.0" stroke="#8fa6bb" stroke-width="2" marker-end="url(#arrow)"/><line x1="736" y1="107.0" x2="764" y2="107.0" stroke="#8fa6bb" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g>
    <rect x="20" y="70" width="148" height="74" rx="10" fill="#ffffff" stroke="#5b7a99" stroke-width="2.5">
      <animate attributeName="fill" values="#ffffff;#bfe3ff;#bfe3ff;#ffffff;#ffffff" keyTimes="0.0000;0.0300;0.1200;0.1700;1.0000" dur="10.0s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#5b7a99;#1f6fb2;#1f6fb2;#5b7a99;#5b7a99" keyTimes="0.0000;0.0300;0.1200;0.1700;1.0000" dur="10.0s" repeatCount="indefinite"/>
    </rect>
    <text x="94.0" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2733">Generate</text>
    <text x="94.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5a68">(Faker, synthetic)</text>
  </g>
  <g>
    <rect x="208" y="70" width="148" height="74" rx="10" fill="#ffffff" stroke="#5b7a99" stroke-width="2.5">
      <animate attributeName="fill" values="#ffffff;#ffffff;#bfe3ff;#bfe3ff;#ffffff;#ffffff" keyTimes="0.0000;0.2000;0.2300;0.3200;0.3700;1.0000" dur="10.0s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#5b7a99;#5b7a99;#1f6fb2;#1f6fb2;#5b7a99;#5b7a99" keyTimes="0.0000;0.2000;0.2300;0.3200;0.3700;1.0000" dur="10.0s" repeatCount="indefinite"/>
    </rect>
    <text x="282.0" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2733">Discover</text>
    <text x="282.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5a68">sanctioned split</text>
  </g>
  <g>
    <rect x="396" y="70" width="148" height="74" rx="10" fill="#ffffff" stroke="#5b7a99" stroke-width="2.5">
      <animate attributeName="fill" values="#ffffff;#ffffff;#bfe3ff;#bfe3ff;#ffffff;#ffffff" keyTimes="0.0000;0.4000;0.4300;0.5200;0.5700;1.0000" dur="10.0s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#5b7a99;#5b7a99;#1f6fb2;#1f6fb2;#5b7a99;#5b7a99" keyTimes="0.0000;0.4000;0.4300;0.5200;0.5700;1.0000" dur="10.0s" repeatCount="indefinite"/>
    </rect>
    <text x="470.0" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2733">Classify</text>
    <text x="470.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5a68">DLP + risk tier</text>
  </g>
  <g>
    <rect x="584" y="70" width="148" height="74" rx="10" fill="#ffffff" stroke="#5b7a99" stroke-width="2.5">
      <animate attributeName="fill" values="#ffffff;#ffffff;#bfe3ff;#bfe3ff;#ffffff;#ffffff" keyTimes="0.0000;0.6000;0.6300;0.7200;0.7700;1.0000" dur="10.0s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#5b7a99;#5b7a99;#1f6fb2;#1f6fb2;#5b7a99;#5b7a99" keyTimes="0.0000;0.6000;0.6300;0.7200;0.7700;1.0000" dur="10.0s" repeatCount="indefinite"/>
    </rect>
    <text x="658.0" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2733">Govern</text>
    <text x="658.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5a68">verified matrix</text>
  </g>
  <g>
    <rect x="772" y="70" width="148" height="74" rx="10" fill="#ffffff" stroke="#5b7a99" stroke-width="2.5">
      <animate attributeName="fill" values="#ffffff;#ffffff;#bfe3ff;#bfe3ff;#ffffff;#ffffff" keyTimes="0.0000;0.8000;0.8300;0.9200;0.9700;1.0000" dur="10.0s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#5b7a99;#5b7a99;#1f6fb2;#1f6fb2;#5b7a99;#5b7a99" keyTimes="0.0000;0.8000;0.8300;0.9200;0.9700;1.0000" dur="10.0s" repeatCount="indefinite"/>
    </rect>
    <text x="846.0" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2733">Validate</text>
    <text x="846.0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5a68">harness + report</text>
  </g>
  <circle r="7" fill="#1f6fb2" fill-opacity="0.9">
    <animateMotion path="M 94.0,107.0 L 282.0,107.0 L 470.0,107.0 L 658.0,107.0 L 846.0,107.0" dur="10.0s" repeatCount="indefinite" rotate="0" keyPoints="0;0.02;0.18;0.20;0.38;0.40;0.58;0.60;0.78;0.80;1" keyTimes="0;0.02;0.18;0.2;0.38;0.4;0.58;0.6;0.78;0.8;1" calcMode="linear"/>
  </circle>
</svg>